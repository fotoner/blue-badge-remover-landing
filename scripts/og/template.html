<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OG 이미지 — Blue Badge Remover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  /* 왼쪽 글은 확장 프로그램 docs/DESIGN.md 토큰 — 장식 없이, border가 있으면 radius 0 */
  :root {
    --bg: #0e1418;
    --text-primary: #f5f9fc;
    --text-secondary: #d7e1e8;
    --accent: #1d9bf0;
    --line: rgba(255, 255, 255, 0.1);
    /* 오른쪽 타임라인은 X 다크 모드 색 */
    --x-bg: #000;
    --x-border: #2f3336;
    --x-text: #e7e9ea;
    --x-sub: #71767b;
    --bbr-placeholder: #536471;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: "IBM Plex Sans KR", sans-serif;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }

  /* 플랫폼별 잘림에 대비해 좌우 80px·상하 60px 안에만 내용을 둔다 */
  .card { width: 1200px; height: 630px; padding: 60px 80px; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  header svg { width: 32px; height: 32px; }
  header span { font-size: 23px; font-weight: 700; }
  .content { flex: 1; display: grid; grid-template-columns: 470px 1fr; gap: 38px; align-items: center; }

  h1 { font-size: 56px; line-height: 1.3; letter-spacing: -2px; margin-bottom: 22px; }
  h1 span { display: block; }
  .description { font-size: 26px; line-height: 1.5; color: var(--text-secondary); }
  /* 피드 썸네일(약 1/3 크기)에서도 읽히도록 크고 밝게 */
  .summary { margin-top: 28px; padding-left: 18px; border-left: 3px solid var(--accent); font-size: 26px; line-height: 1.6; color: var(--text-secondary); }

  /* 오른쪽: 확장을 켠 X 홈 타임라인 — 실제 화면을 약 1.5배로 */
  .timeline {
    background: var(--x-bg);
    border: 1px solid var(--x-border);
    color: var(--x-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  }
  .timeline > * + * { border-top: 1px solid var(--x-border); }
  /* 확장이 숨긴 트윗 자리에 넣는 표시(.bbr-placeholder)와 같은 모양 */
  .placeholder {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 76px; padding: 12px 20px; text-align: center;
    color: var(--bbr-placeholder); font-size: 19px; line-height: 1.4;
  }
  .placeholder svg { width: 22px; height: 22px; flex: none; opacity: 0.6; }
  .tweet { display: flex; gap: 14px; padding: 16px 20px 14px; }
  .avatar { width: 52px; height: 52px; flex: none; border-radius: 50%; }
  .body { flex: 1; min-width: 0; }
  .meta { display: flex; align-items: center; gap: 4px; font-size: 21px; line-height: 1.3; white-space: nowrap; }
  .meta .verified { width: 22px; height: 22px; flex: none; }
  .meta .sub { margin-left: 4px; color: var(--x-sub); }
  .text { margin-top: 4px; font-size: 22px; line-height: 1.4; }
  .actions { display: flex; justify-content: space-between; max-width: 330px; margin-top: 12px; color: var(--x-sub); }
  .actions svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<!-- 반복되는 아이콘 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="verified" viewBox="0 0 22 22"><path fill="#1d9bf0" d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.607-.274 1.264-.144 1.897.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/></symbol>
    <symbol id="reply" viewBox="0 0 24 24"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></symbol>
    <symbol id="repost" viewBox="0 0 24 24"><path d="m2 9 3-3 3 3"/><path d="M13 18H7a2 2 0 0 1-2-2V6"/><path d="m22 15-3 3-3-3"/><path d="M11 6h6a2 2 0 0 1 2 2v10"/></symbol>
    <symbol id="like" viewBox="0 0 24 24"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></symbol>
    <symbol id="views" viewBox="0 0 24 24"><path d="M5 21v-6"/><path d="M12 21V3"/><path d="M19 21V9"/></symbol>
  </defs>
</svg>

<main class="card">
  <header>
    <!-- public/icon.svg -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 22 22" aria-hidden="true">
      <path fill="#F4212E" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34z"/>
      <g stroke="white" stroke-width="2.2" stroke-linecap="round">
        <line x1="9" y1="9" x2="15" y2="15"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
      </g>
    </svg>
    <span>Blue Badge Remover</span>
  </header>

  <div class="content">
    <section>
      <h1><span>파딱은 숨기고,</span><span>트친은 그대로.</span></h1>
      <p class="description">유료 파란 뱃지의 글만 숨깁니다.<br>팔로우한 사람은 남겨둡니다.</p>
      <p class="summary">무료 브라우저 확장<br>Chrome · Firefox · Edge</p>
    </section>

    <div class="timeline">
      <!-- 팔로우하지 않은 파딱: 확장이 접어 둔 자리 (문구는 확장 i18n hiddenTweetFadak) -->
      <div class="placeholder">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1L2 3.5v4c0 3.5 2.6 6.4 6 7.5 3.4-1.1 6-4 6-7.5v-4L8 1zm0 2.2l4 1.7v2.6c0 2.6-1.9 4.8-4 5.7-2.1-.9-4-3.1-4-5.7V4.9l4-1.7z"/></svg>
        <span>파딱 @issue_kr의 트윗이 숨겨졌습니다 (클릭하여 펼치기)</span>
      </div>

      <!-- 팔로우한 파딱: 그대로 보인다 -->
      <article class="tweet">
        <div class="avatar" style="background:#4f6372"></div>
        <div class="body">
          <div class="meta"><strong>모래</strong><svg class="verified" aria-hidden="true"><use href="#verified"/></svg><span class="sub">@morae_log · 3시간</span></div>
          <p class="text">퇴근하고 산책했는데 바람이 진짜 좋다</p>
          <div class="actions">
            <svg aria-hidden="true"><use href="#reply"/></svg>
            <svg aria-hidden="true"><use href="#repost"/></svg>
            <svg aria-hidden="true"><use href="#like"/></svg>
            <svg aria-hidden="true"><use href="#views"/></svg>
          </div>
        </div>
      </article>

      <!-- 뱃지 없는 계정 -->
      <article class="tweet">
        <div class="avatar" style="background:#7a6a58"></div>
        <div class="body">
          <div class="meta"><strong>여름기록</strong><span class="sub">@summer_rec · 5시간</span></div>
          <p class="text">주말에 읽을 책 빌려왔다.</p>
          <div class="actions">
            <svg aria-hidden="true"><use href="#reply"/></svg>
            <svg aria-hidden="true"><use href="#repost"/></svg>
            <svg aria-hidden="true"><use href="#like"/></svg>
            <svg aria-hidden="true"><use href="#views"/></svg>
          </div>
        </div>
      </article>
    </div>
  </div>
</main>
</body>
</html>
